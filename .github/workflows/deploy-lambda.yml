name: Deploy Lambda Worker

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'

  workflow_dispatch: # Allow manual trigger from GitHub UI
    inputs:
      image_tag:
        description: "Roll back: deploy an existing image tag (a commit SHA) without building. Leave empty to build this commit."
        required: false
        default: ""

jobs:
  test:
    name: Worker unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: worker/requirements.txt

      - name: Install
        run: pip install -r worker/requirements.txt pytest

      - name: Test
        working-directory: worker
        env:
          # the tests mock the database, the queue and the models; these only satisfy imports
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          GEMINI_API_KEY: test
          ANTHROPIC_API_KEY: test
        run: python -m pytest tests -q

  deploy:
    name: Build & Deploy to Lambda
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Use an existing image (rollback)
        id: existing
        if: ${{ inputs.image_tag != '' }}
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: echo "image=$ECR_REGISTRY/medclaim-worker:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Build, tag, and push image to ECR
        id: build
        if: ${{ inputs.image_tag == '' }}
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: medclaim-worker
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            --platform linux/amd64 \
            --provenance=false \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            ./worker

          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Update Lambda function
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          aws lambda update-function-code \
            --function-name medclaim-worker \
            --image-uri ${{ steps.build.outputs.image || steps.existing.outputs.image }} \
            --region ap-south-1

          # Wait for update to complete
          aws lambda wait function-updated \
            --function-name medclaim-worker \
            --region ap-south-1

          echo "Lambda updated to ${{ steps.build.outputs.image || steps.existing.outputs.image }}"

      - name: Verify deployment
        run: |
          STATE=$(aws lambda get-function-configuration \
            --function-name medclaim-worker \
            --region ap-south-1 \
            --query 'State' \
            --output text)
          echo "Lambda state: $STATE"
          if [ "$STATE" != "Active" ]; then
            echo "Lambda is not active!"
            exit 1
          fi
