name: Deploy Lambda Worker

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'

  workflow_dispatch: # Allow manual trigger from GitHub UI

jobs:
  deploy:
    name: Build & Deploy to Lambda
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to ECR
        id: build
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: medclaim-worker
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            --platform linux/amd64 \
            --provenance=false \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            ./worker

          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Update Lambda function
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          aws lambda update-function-code \
            --function-name medclaim-worker \
            --image-uri ${{ steps.build.outputs.image }} \
            --region ap-south-1

          # Wait for update to complete
          aws lambda wait function-updated \
            --function-name medclaim-worker \
            --region ap-south-1

          echo "Lambda updated to ${{ steps.build.outputs.image }}"

      - name: Verify deployment
        run: |
          STATE=$(aws lambda get-function-configuration \
            --function-name medclaim-worker \
            --region ap-south-1 \
            --query 'State' \
            --output text)
          echo "Lambda state: $STATE"
          if [ "$STATE" != "Active" ]; then
            echo "Lambda is not active!"
            exit 1
          fi
